[package]
name = "dotlink"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
description = "Declarative dotfile symlink manager"
repository = "https://github.com/yjydist/dotlink"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
toml = "1.1"
thiserror = "2.0"
time = "0.3"

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
rustix = { version = "1.1", features = ["fs"] }

[dev-dependencies]
assert_cmd = "2.2"
predicates = "3.1"
tempfile = "3.27"

[lib]
name = "dotlink"
path = "src/lib.rs"

[[bin]]
name = "dotlink"
path = "src/main.rs"

[lints.clippy]
all = "warn"

[lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
