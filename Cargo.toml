[package]
name = "dotlink"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
toml = "1.1"
thiserror = "2.0"
time = { version = "0.3", features = ["formatting", "local-offset"] }

[dev-dependencies]
assert_cmd = "2.2"
predicates = "3.1"
tempfile = "3.27"

[lib]
name = "dotlink"
path = "src/lib.rs"

[[bin]]
name = "dotlink"
path = "src/main.rs"

[lints.clippy]
all = "warn"

[lints.rust]
unsafe_code = "forbid"