schema: spec-driven

# Project context (optional)
# Add only constraints that should guide OpenSpec artifacts and workflows.
# Include constraints an agent cannot infer by reading the code.
# Keep general project documentation and discoverable codebase facts out.
# Example:
context: |
  - ASCII Art 请只使用 ASCII 字符, 不要使用中文字符, 因为中文字符和 ASCII 不是严格 2:1 的宽度; 并且如果可以, 尽量用 mermaid 代替 ASCII Art
  - 所有 artifact 的自然语言使用简体中文
  - 使用 Rust 2024 edition.
  - MSRV 为 1.97 (以 Cargo.toml 的 rust-version 为准), 不使用 nightly 特性.
  - 仅支持 macOS 与 Linux; 其他平台在参数解析前退 3, 不承诺运行时支持.
  - 不使用异步运行时, 命令同步执行.
  - 不写状态文件, 运行状态由清单与文件系统决定.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
rules:
  proposal:
    - 自然语言使用简体中文, 标点仅用 ASCII, 与 AGENTS.md 一致.
    - 与 README.md 及 openspec/specs/ 的现有行为保持一致; 有意改变行为时先写明差异.
  specs:
    - 自然语言使用简体中文, 标点仅用 ASCII, 与 AGENTS.md 一致.
    - 每个 Scenario 给出可执行命令或可观察结果, 不写无法验证的意图.
    - 与 README.md 及现有 openspec/specs/ 的行为描述一致; 新增行为必须明确标记.
  design:
    - 自然语言使用简体中文, 标点仅用 ASCII, 与 AGENTS.md 一致.
    - 记录被否决的备选方案与否决理由.
    - 决策必须能落到 tasks 的具体步骤.
    - 与 README.md 及 openspec/specs/ 的现有行为保持一致.
  tasks:
    - 自然语言使用简体中文, 标点仅用 ASCII, 与 AGENTS.md 一致.
    - 每个任务写明验证命令或可观察结果.
    - 每组包含该组的验证任务.
    - 与 README.md 及 openspec/specs/ 的现有行为一致, 不安排与规格冲突的改动.

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
